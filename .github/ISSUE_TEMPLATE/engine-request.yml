name: Engine/API request
description: Request a change to the public Freestyle Studio API.
title: "[engine] "
body:
  - type: textarea
    id: request
    attributes:
      label: What does the UI need?
      description: Link the relevant public API documentation. Include a synthetic example and the expected behavior.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue uses synthetic data and contains no credentials, signed URLs, or private project information.
          required: true
